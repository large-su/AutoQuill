name: test

on:
  push:
    branches: [main]
  # main 与发布 tag 指向同一提交，仅 main 触发一次完整回归。
  workflow_dispatch:

# 同一 ref 连推时只保留最新一次，避免排队白等
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    env:
      # Keep subprocess JSON output deterministic on Windows runners.
      PYTHONIOENCODING: utf-8
    strategy:
      # Preserve both platform results when only one fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        # 一次 pip 调用（原来分两次）+ pip 缓存：安装步骤从这里省时间
        run: |
          python -m pip install --upgrade pip --quiet
          python -m pip install --quiet -r requirements.txt fastapi uvicorn pydantic requests httpx

      - name: Prepare local-only config for tests
        # config/llm_providers.json 含用户密钥、不入库（.gitignore）；
        # CI 用占位示例文件生成，保证 config 模块可导入（单测只读不调 API）。
        run: cp config/llm_providers.example.json config/llm_providers.json

      - name: Run unit tests (skip browser-dependent suites)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          python tests/run_all.py 2>&1 | tee logs/unittest-${{ runner.os }}.log

      - name: Save unit test log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: unittest-${{ runner.os }}-${{ github.run_attempt }}
          path: logs/unittest-${{ runner.os }}.log
          retention-days: 14
          if-no-files-found: warn
