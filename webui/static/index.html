<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoQuill 控制台</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #141a24;
    --panel-2: #1a2130;
    --border: #232b3d;
    --text: #dbe3f0;
    --muted: #7d8aa3;
    --accent: #6366f1;
    --accent-2: #a78bfa;
    --green: #34d399;
    --red: #f87171;
    --amber: #fbbf24;
    --orange: #fb923c;
    --mono: "Cascadia Code", Consolas, "JetBrains Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 14px;
    overflow: hidden;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #2b3550; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #38456b; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---------- 顶栏 ---------- */
  header {
    height: 52px;
    display: flex; align-items: center; gap: 14px;
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #10151f, #0d1119);
    position: relative; z-index: 5;
  }
  .logo {
    display: flex; align-items: center; gap: 10px;
    font-size: 17px; font-weight: 700; letter-spacing: 0.5px;
    user-select: none;
  }
  .logo .feather { font-size: 20px; }
  .logo em {
    font-style: normal;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .status-pill {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 14px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--panel);
    font-size: 12.5px; color: var(--muted); white-space: nowrap;
  }
  .status-pill .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #56617a; flex: none;
  }
  .status-pill.running { color: #93c5fd; border-color: #3b4d74; }
  .status-pill.running .dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse 1.2s infinite; }
  .status-pill.done { color: #6ee7b7; border-color: #24503f; }
  .status-pill.done .dot { background: var(--green); }
  .status-pill.error { color: #fca5a5; border-color: #5f2e35; }
  .status-pill.error .dot { background: var(--red); }
  .status-pill.stopped, .status-pill.stopping { color: #fcd34d; border-color: #5f5020; }
  .status-pill.stopped .dot, .status-pill.stopping .dot { background: var(--amber); }
  .status-pill.timeout { color: #fdba74; border-color: #5f3a22; }
  .status-pill.timeout .dot { background: var(--orange); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  /* ---------- 主区布局 ---------- */
  main {
    display: grid;
    grid-template-columns: 300px minmax(0, 1fr) 380px;
    gap: 14px;
    padding: 14px 16px;
    height: calc(100vh - 52px);
  }
  .col { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    transition: border-color 0.15s;
  }
  .card h2 {
    font-size: 12px; font-weight: 600; color: var(--muted);
    letter-spacing: 1px; margin-bottom: 10px;
    display: flex; align-items: center; gap: 6px;
  }
  .card h2 .badge { color: var(--accent); font-size: 15px; }

  /* ---------- 左列：控制台 ---------- */
  .left-col { overflow-y: auto; padding-right: 2px; }
  .mode-group { display: flex; flex-direction: column; gap: 6px; }
  .mode-opt {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel-2);
    cursor: pointer; user-select: none;
    transition: border-color 0.15s, background 0.15s;
  }
  .mode-opt:hover { border-color: #3b4d74; }
  .mode-opt.sel { border-color: var(--accent); background: rgba(99,102,241,0.12); }
  .mode-opt input { accent-color: var(--accent); }
  .mode-opt .t { font-weight: 600; font-size: 13.5px; }
  .mode-opt .d { color: var(--muted); font-size: 11.5px; margin-top: 1px; }
  .params-batch {
    display: flex; gap: 10px; margin: 8px 0 4px;
  }
  .params-batch label { flex: 1; }
  .params-batch span { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .params-batch input {
    width: 100%; padding: 7px 10px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--panel-2);
    color: var(--text); font-size: 13px;
  }
  .params-batch input:focus { outline: none; border-color: var(--accent); }
  .run-row { display: flex; gap: 8px; margin-top: 10px; }
  button {
    border: none; border-radius: 8px; cursor: pointer;
    font-size: 13.5px; font-weight: 600;
    padding: 10px 0; font-family: inherit;
    transition: filter 0.15s, opacity 0.15s;
  }
  button:hover { filter: brightness(1.12); }
  button:disabled { opacity: 0.45; cursor: not-allowed; filter: none; }
  .btn-run {
    flex: 1.4; color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 2px 10px rgba(99,102,241,0.35);
  }
  .btn-stop {
    flex: 1; color: var(--red);
    background: transparent; border: 1px solid #5f2e35;
  }
  .btn-stop:hover { background: rgba(248,113,113,0.08); }

  .cfg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .cfg-cell {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 7px; padding: 6px 9px;
  }
  .cfg-cell .k { font-size: 10.5px; color: var(--muted); }
  .cfg-cell .v { font-size: 12.5px; font-weight: 600; margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cfg-cell .v.on { color: var(--green); }
  .cfg-cell .v.off { color: var(--muted); font-weight: 400; }

  /* ---------- 中列：日志 ---------- */
  .log-col { flex: 1; }
  .log-card { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .log-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .log-head .spacer { flex: 1; }
  .autoscroll { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; }
  .autoscroll input { accent-color: var(--accent); }
  .progress-wrap { display: none; margin-bottom: 10px; }
  .progress-wrap.show { display: block; }
  .progress-bar {
    height: 5px; border-radius: 3px; overflow: hidden;
    background: var(--panel-2);
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width 0.4s ease;
    position: relative; overflow: hidden;
  }
  .progress-fill::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
    animation: slide 1.4s infinite;
  }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
  .progress-text { font-size: 11.5px; color: var(--muted); margin-top: 5px; }
  .log-box {
    flex: 1; overflow-y: auto; min-height: 0;
    background: #0c1017; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px;
    font-family: var(--mono); font-size: 12px; line-height: 1.7;
  }
  .log-line { white-space: pre-wrap; word-break: break-all; color: #aab4c8; }
  .log-line .ts { color: #56617a; }
  .log-line.stage { color: #93c5fd; font-weight: 600; }
  .log-line.stage::before { content: "▸ "; color: var(--accent); }
  .log-line.result { color: var(--green); }
  .log-line.result::before { content: "✓ "; }
  .log-line.error { color: #fca5a5; }
  .log-line.run_end { color: var(--text); font-weight: 700; }
  .log-box .placeholder { color: #56617a; font-style: italic; }

  /* ---------- 右列：结果 ---------- */
  .right-col { overflow-y: auto; padding-right: 2px; }
  .res-card { display: none; }
  .res-card.show { display: block; }
  .res-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; line-height: 1.5; }
  .res-sub { font-size: 11px; color: var(--muted); margin-bottom: 8px; word-break: break-all; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip {
    font-size: 11px; padding: 2.5px 9px; border-radius: 999px;
    background: var(--panel-2); border: 1px solid var(--border); color: var(--muted);
  }
  .chip.acc { color: #a5b4fc; border-color: #3b4d74; }
  details {
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--panel-2); margin-top: 8px; overflow: hidden;
  }
  details summary {
    cursor: pointer; padding: 8px 12px; font-size: 12px;
    color: #a5b4fc; user-select: none; list-style: none;
  }
  details summary::before { content: "▸ "; }
  details[open] summary::before { content: "▾ "; }
  details summary:hover { background: rgba(99,102,241,0.08); }
  details .body {
    padding: 10px 12px; font-size: 12.5px; line-height: 1.75;
    border-top: 1px solid var(--border); white-space: pre-wrap; word-break: break-all;
    color: #c6d0e2; max-height: 380px; overflow-y: auto;
  }
  .story-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .empty-note { color: var(--muted); font-size: 12px; padding: 4px 0; }
  .story-list { display: flex; flex-direction: column; gap: 5px; }
  .story-item {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--panel-2);
    cursor: pointer; font-size: 12.5px;
    transition: border-color 0.15s;
  }
  .story-item:hover { border-color: var(--accent); }
  .story-item .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .story-item .s { color: var(--muted); font-size: 11px; flex: none; }

  /* 故事详情弹层 */
  .modal-mask {
    display: none; position: fixed; inset: 0; z-index: 50;
    background: rgba(4,6,10,0.72); backdrop-filter: blur(3px);
    padding: 40px 60px;
  }
  .modal-mask.show { display: flex; align-items: stretch; justify-content: center; }
  .modal {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; width: min(860px, 100%);
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .modal-head {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
  }
  .modal-head .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .modal-head .close {
    margin-left: auto; background: transparent; color: var(--muted);
    padding: 4px 12px; border: 1px solid var(--border);
  }
  .modal-head .close:hover { color: var(--red); border-color: #5f2e35; }
  .modal-body {
    flex: 1; overflow-y: auto; padding: 16px 20px;
    font-size: 13.5px; line-height: 1.9; white-space: pre-wrap; word-break: break-all;
  }

  @media (max-width: 1200px) {
    main { grid-template-columns: 280px minmax(0,1fr); height: auto; overflow: visible; }
    body { overflow: auto; }
    .right-col { grid-column: 1 / -1; }
  }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="logo"><span class="feather">✒️</span>Auto<em>Quill</em></div>
  <div class="top-right">
    <div id="statusPill" class="status-pill"><span class="dot"></span><span id="statusText">空闲</span></div>
  </div>
</header>

<main>
  <!-- 左列：运行控制 + 配置速览 -->
  <div class="col left-col">
    <div class="card">
      <h2><span class="badge">▶</span>运行控制</h2>
      <div class="mode-group" id="modeGroup">
        <label class="mode-opt"><input type="radio" name="mode" value="select">
          <div><div class="t">环节测试 · 选题</div><div class="d">自动选题，打开问题页</div></div></label>
        <label class="mode-opt sel"><input type="radio" name="mode" value="extract" checked>
          <div><div class="t">环节测试 · 提取</div><div class="d">选题 + 提取高赞回答</div></div></label>
        <label class="mode-opt"><input type="radio" name="mode" value="generate">
          <div><div class="t">环节测试 · 生成</div><div class="d">提取 + 生成故事并存盘</div></div></label>
        <label class="mode-opt"><input type="radio" name="mode" value="single">
          <div><div class="t">单轮（完整链路）</div><div class="d">选题 → 生成 → 发布草稿</div></div></label>
        <label class="mode-opt"><input type="radio" name="mode" value="batch">
          <div><div class="t">批量运行</div><div class="d">多轮生成 + 发布到草稿</div></div></label>
      </div>
      <div class="params-batch" id="batchParams" style="display:none">
        <label><span>生成数量</span><input type="number" id="genCount" min="1" max="20" value="5"></label>
        <label><span>发布数量</span><input type="number" id="pubCount" min="0" max="20" value="3"></label>
      </div>
      <div class="run-row">
        <button class="btn-run" id="btnRun">运行</button>
        <button class="btn-stop" id="btnStop" disabled>停止</button>
      </div>
    </div>

    <div class="card">
      <h2><span class="badge">⚙</span>配置速览</h2>
      <div class="cfg-grid" id="cfgGrid"><div class="empty-note">加载中…</div></div>
    </div>
  </div>

  <!-- 中列：日志 -->
  <div class="col log-col">
    <div class="card log-card">
      <div class="log-head">
        <h2 style="margin-bottom:0"><span class="badge">◧</span>运行日志</h2>
        <div class="spacer"></div>
        <label class="autoscroll"><input type="checkbox" id="autoScroll" checked>自动滚动</label>
      </div>
      <div class="progress-wrap" id="progressWrap">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-text" id="progressText">等待生成…</div>
      </div>
      <div class="log-box" id="logBox"><div class="placeholder">点击「运行」开始，日志将实时显示在这里。</div></div>
    </div>
  </div>

  <!-- 右列：结果 -->
  <div class="col right-col">
    <div class="card res-card" id="extractCard">
      <h2><span class="badge">◉</span>提取结果</h2>
      <div class="res-title" id="extractTitle"></div>
      <div class="res-sub" id="extractUrl"></div>
      <div class="chips" id="extractChips"></div>
      <details id="sampleDetail">
        <summary>采样注入预览（前 3000 字）</summary>
        <div class="body" id="samplePreview"></div>
      </details>
      <details id="answerDetail">
        <summary>完整回答</summary>
        <div class="body" id="answerBody"></div>
      </details>
    </div>

    <div class="card res-card" id="storyCard">
      <h2><span class="badge">✦</span>生成故事</h2>
      <div class="res-title" id="storyTitle"></div>
      <div class="story-meta" id="storyMeta"></div>
      <details id="storyDetail">
        <summary>故事全文</summary>
        <div class="body" id="storyBody"></div>
      </details>
    </div>

    <div class="card">
      <h2><span class="badge">☰</span>历史故事</h2>
      <div class="story-list" id="storyList"><div class="empty-note">加载中…</div></div>
    </div>
  </div>
</main>

<!-- 故事全文弹层 -->
<div class="modal-mask" id="modalMask">
  <div class="modal">
    <div class="modal-head">
      <span class="n" id="modalName"></span>
      <button class="close" id="modalClose">关闭</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const STATE_TEXT = {
  idle: "空闲", running: "运行中", stopping: "停止中",
  done: "完成", error: "出错", stopped: "已停止", timeout: "超时",
};

const CFG_LABELS = {
  LLM_MODE: "LLM 模式", LLM_PROVIDER: "提供商", LLM_MODEL: "模型",
  WEB_DRIVER_NAME: "浏览器", QUESTION_SELECT_MODE: "选题模式",
  STORY_MATERIAL_MODE: "素材模式", AUTHOR_PROFILE: "作者风格",
  ENABLE_FORMAT_RETRY: "格式重试", MIN_ANSWER_LENGTH: "最短回答",
  ENABLE_STORY_FILTER: "故事过滤", ENABLE_MATERIAL_LIKES_GATE: "点赞门槛",
  MATERIAL_MIN_LIKES: "最低点赞", LONG_FORM_MODE: "长文模式",
  META_LEARN_ENABLE: "元学习", KB_ENABLE: "知识库",
};

let es = null;
let currentMode = "extract";
let genChars = 0;
let formatScore = null;

/* ---------- 状态 ---------- */

function setState(state, message) {
  const pill = $("statusPill");
  pill.className = "status-pill " + (state === "running" ? "running" : state);
  $("statusText").textContent = STATE_TEXT[state] || state;
  if (message && state !== "running") $("statusText").textContent = STATE_TEXT[state] || state;
  $("btnRun").disabled = (state === "running" || state === "stopping");
  $("btnStop").disabled = !(state === "running" || state === "stopping");
  if (state !== "running") $("progressWrap").classList.remove("show");
}

/* ---------- 日志 ---------- */

function addLog(text, cls) {
  const box = $("logBox");
  const ph = box.querySelector(".placeholder");
  if (ph) ph.remove();
  const line = document.createElement("div");
  line.className = "log-line " + (cls || "");
  line.textContent = text;
  box.appendChild(line);
  if ($("autoScroll").checked) box.scrollTop = box.scrollHeight;
}

function handleLogEvent(ev, cls) {
  const payload = JSON.parse(ev.data);
  addLog(payload.raw || payload.text, cls);
}

/* ---------- 结果渲染 ---------- */

function renderContext(ctx) {
  if (!ctx) return;
  if (ctx.title) {
    $("extractCard").classList.add("show");
    $("extractTitle").textContent = ctx.title;
    $("extractUrl").textContent = ctx.url || "";
    const chips = [];
    if (ctx.answer) chips.push(`回答 ${ctx.answer.length} 字`);
    const f = ctx.footer || {};
    if (f.likes) chips.push(`赞 ${f.likes}`);
    if (f.comments) chips.push(`评 ${f.comments}`);
    if (f.favorites) chips.push(`藏 ${f.favorites}`);
    if (f.thanks) chips.push(`喜 ${f.thanks}`);
    if (f.time) chips.push(`发表 ${f.time}`);
    $("extractChips").innerHTML = chips
      .map((c) => `<span class="chip acc">${esc(c)}</span>`).join("");
    $("answerBody").textContent = ctx.answer || "(无内容)";
  }
  if (ctx.sample_preview) {
    $("samplePreview").textContent = ctx.sample_preview;
    $("sampleDetail").style.display = "";
  } else {
    $("sampleDetail").style.display = "none";
  }
}

function renderStory(story, title) {
  if (!story || !story.text) return;
  $("storyCard").classList.add("show");
  $("storyTitle").textContent = title || "已生成";
  const meta = [`${story.chars} 字`];
  if (story.md_path) meta.push(story.md_path);
  if (formatScore !== null) meta.push(`格式检测 ${formatScore}/10`);
  $("storyMeta").innerHTML = meta.map((m) => `<span class="chip acc">${esc(m)}</span>`).join("");
  $("storyBody").textContent = story.text;
}

/* ---------- 历史故事 ---------- */

async function loadStories() {
  try {
    const r = await fetch("/api/stories");
    const data = await r.json();
    const list = $("storyList");
    if (!data.stories.length) {
      list.innerHTML = '<div class="empty-note">暂无故事（运行后自动生成）</div>';
      return;
    }
    list.innerHTML = "";
    data.stories.forEach((s) => {
      const item = document.createElement("div");
      item.className = "story-item";
      const d = new Date(s.mtime * 1000);
      const time = `${d.getMonth() + 1}-${String(d.getDate()).padStart(2, "0")} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
      item.innerHTML = `<span class="n">${esc(s.name)}</span><span class="s">${(s.size / 1024).toFixed(1)}k · ${time}</span>`;
      item.onclick = () => openStory(s.name);
      list.appendChild(item);
    });
  } catch (e) {
    $("storyList").innerHTML = '<div class="empty-note">加载失败</div>';
  }
}

async function openStory(name) {
  try {
    const r = await fetch("/api/story?name=" + encodeURIComponent(name));
    const data = await r.json();
    $("modalName").textContent = data.name;
    $("modalBody").textContent = data.text;
    $("modalMask").classList.add("show");
  } catch (e) { /* ignore */ }
}

/* ---------- 配置速览 ---------- */

async function loadConfig() {
  try {
    const r = await fetch("/api/config");
    const cfg = await r.json();
    const grid = $("cfgGrid");
    grid.innerHTML = "";
    Object.entries(CFG_LABELS).forEach(([k, label]) => {
      if (!(k in cfg)) return;
      const v = cfg[k];
      const cls = (typeof v === "boolean") ? (v ? "on" : "off") : "";
      const txt = (typeof v === "boolean") ? (v ? "开" : "关") : String(v);
      const cell = document.createElement("div");
      cell.className = "cfg-cell";
      cell.innerHTML = `<div class="k">${esc(label)}</div><div class="v ${cls}">${esc(txt)}</div>`;
      grid.appendChild(cell);
    });
  } catch (e) {
    $("cfgGrid").innerHTML = '<div class="empty-note">配置加载失败</div>';
  }
}

/* ---------- 任务运行 ---------- */

function connectSSE() {
  if (es) es.close();
  es = new EventSource("/api/events");
  es.addEventListener("stage", (e) => handleLogEvent(e, "stage"));
  es.addEventListener("result", (e) => handleLogEvent(e, "result"));
  es.addEventListener("error", (e) => handleLogEvent(e, "error"));
  es.addEventListener("log", (e) => handleLogEvent(e, ""));
  es.addEventListener("run_end", (e) => handleLogEvent(e, "run_end"));
  es.addEventListener("progress", (e) => {
    const p = JSON.parse(e.data);
    genChars = p.chars;
    $("progressWrap").classList.add("show");
    const pct = Math.min(100, Math.round((genChars / 8000) * 100));
    $("progressFill").style.width = pct + "%";
    $("progressText").textContent = `模型输出中… 已生成 ${genChars} 字（估算目标 8000）`;
    // 顺手从日志行里抓格式分
    const m = (p.text || "").match(/格式检测[：:]\s*(\d+)\s*\/\s*10/);
    if (m) formatScore = parseInt(m[1], 10);
  });
  es.addEventListener("state", (e) => {
    const s = JSON.parse(e.data);
    setState(s.state, s.message);
    if (["done", "error", "stopped", "timeout"].includes(s.state)) {
      genChars = 0;
      refreshStatus();
      loadStories();
    }
  });
  es.onopen = () => addLog("已连接实时日志通道", "result");
}

async function refreshStatus() {
  try {
    const r = await fetch("/api/status");
    const st = await r.json();
    if (st.context && st.context.title) renderContext(st.context);
    if (st.story && st.story.text) {
      const ctx = st.context || {};
      renderStory(st.story, ctx.title || null);
    }
  } catch (e) { /* ignore */ }
}

async function run() {
  const body = { mode: currentMode };
  if (currentMode === "batch") {
    body.gen_count = parseInt($("genCount").value, 10) || 5;
    body.publish_count = parseInt($("pubCount").value, 10) || 3;
  }
  $("logBox").innerHTML = "";
  genChars = 0;
  formatScore = null;
  try {
    const r = await fetch("/api/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      addLog("启动失败：" + (err.detail || r.status), "error");
      return;
    }
    connectSSE();
  } catch (e) {
    addLog("无法连接服务：" + e, "error");
  }
}

async function stop() {
  try {
    await fetch("/api/stop", { method: "POST" });
    addLog("已发送停止请求…", "error");
  } catch (e) { /* ignore */ }
}

/* ---------- 初始化 ---------- */

document.querySelectorAll("#modeGroup input[name=mode]").forEach((el) => {
  el.addEventListener("change", () => {
    currentMode = el.value;
    document.querySelectorAll(".mode-opt").forEach((o) =>
      o.classList.toggle("sel", o.querySelector("input").checked));
    $("batchParams").style.display = (currentMode === "batch") ? "" : "none";
  });
});

$("btnRun").onclick = run;
$("btnStop").onclick = stop;
$("modalClose").onclick = () => $("modalMask").classList.remove("show");
$("modalMask").addEventListener("click", (e) => {
  if (e.target === $("modalMask")) $("modalMask").classList.remove("show");
});

(async () => {
  loadConfig();
  loadStories();
  try {
    const r = await fetch("/api/status");
    const st = await r.json();
    setState(st.state, st.message);
    if (st.state === "running") connectSSE();
  } catch (e) {
    setState("error", "无法连接后端");
  }
})();
</script>
</body>
